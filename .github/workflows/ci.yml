name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push to a pull request cancels its older run so runners never work
# through stale commits; runs on main (which deploy) are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify toolchain majors
        # npm ci only needs the same MAJORS that wrote the lockfile (node 24 /
        # npm 11). Byte-exact patch pins here and in .nvmrc are what kept
        # breaking installs: any registry/mirror gap for that one version fails
        # the build — Cloudflare's tool installer hit exactly that.
        run: |
          node --version | grep -Eq '^v24\.' || (echo "need Node 24.x, got $(node --version)" && exit 1)
          npm --version | grep -Eq '^11\.' || (echo "need npm 11.x, got $(npm --version)" && exit 1)

      # Dependencies are all prebuilt JS/native packages; suppress lifecycle
      # scripts to avoid Sharp falling back to an unnecessary source build.
      - run: npm ci --ignore-scripts

      - run: npm run audit:production

      - run: npm run lint

      - run: npm test

      - run: npm run test:workers

      - run: npm run test:coverage

      - name: Build and prove retired static credentials cannot enter the bundle
        run: npm run build
        env:
          VITE_RELAY_TOKEN: STATIC_RELAY_SECRET_MUST_NOT_SHIP
          VITE_TURN_USERNAME: STATIC_TURN_USER_MUST_NOT_SHIP
          VITE_TURN_CREDENTIAL: STATIC_TURN_SECRET_MUST_NOT_SHIP

      - run: npm run worker:check

      - run: npx playwright install --with-deps chromium

      - run: npm run check:csp

      - run: npm run test:e2e

      - run: npm run test:e2e:do

  # Mutation testing is a gate like `test`: it runs on every pull request, so
  # the automerge workflow merges only when it passes, and the deploy waits for
  # it. Stryker's incremental report comes back from the cache, so a run
  # re-tests only the mutants in code or tests changed since the last one; the
  # full weekly run is in security.yml and blocks nothing.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      # Each run saves its report under a key of its own and restores the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: stryker-incremental-

      - run: npm run test:mutation

  # Every push to main that passes `test` and `mutation` goes to production (Worker `peerly`),
  # as Workers Builds did before the repository moved to codefusion-cc: the
  # same `npm run build` with the same build variables, then `wrangler deploy`
  # (whose `build` block compiles packages/core). Peerly has no D1 database
  # and no version endpoint;
  # the last step waits for the new entry script instead.
  deploy:
    name: deploy production
    needs: [test, mutation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment:
      name: production
      url: https://peerly.cc
    # One deploy at a time, never cancelled once started. Pushes that land
    # meanwhile wait; only the newest of them runs.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          # The runner's cached Node 24 may be older than the lockfile's engines.
          check-latest: true
          package-manager-cache: false

      # As in `test`; without the token, so no dependency ever sees it.
      - run: npm ci --ignore-scripts

      # Workers Builds' build variables for production (public values: the
      # Google client, the relay and TURN hosts), as the bundle on peerly.cc
      # was built with them.
      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: 724645084534-eb9led5upjj8p46dr890tg3a0k3sonsk.apps.googleusercontent.com
          VITE_SIGNALING: ws-relay
          VITE_RELAY_HOST: relay.peerly.cc
          VITE_RELAY_PORT: '443'
          VITE_TURN_URLS: turn:turn.peerly.cc:3478,turns:turn.peerly.cc:5349

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The production environment's CLOUDFLARE_API_TOKEN secret is not set; see README.md (Deploy)"
            exit 1
          fi
          npx wrangler deploy --message "${GITHUB_SHA::7} ${GITHUB_EVENT_NAME} by ${GITHUB_ACTOR}"

      # No version endpoint: the page's entry script, whose name carries its
      # content hash, says which build peerly.cc serves.
      - name: peerly.cc serves this build
        run: |
          entry="$(grep -o '/assets/index-[^"]*\.js' dist/index.html || true)"
          if [ -z "$entry" ]; then
            echo "::error::dist/index.html names no /assets/index-*.js entry script to look for"
            exit 1
          fi
          for attempt in $(seq 1 12); do
            if curl -sf -H 'cache-control: no-cache' "https://peerly.cc/?$attempt" | grep -qF "$entry"; then
              echo "Live: $entry"
              exit 0
            fi
            echo "Not serving $entry yet; waiting"
            sleep 5
          done
          echo "::error::peerly.cc does not serve $entry a minute after the deploy"
          exit 1
